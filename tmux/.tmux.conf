set -g mouse on
set-option -g terminal-overrides ',xterm-256color:RGB,alacritty:RGB'
set -as terminal-features ",*:hyperlinks"   # pass clickable links (OSC 8) through to Alacritty
set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "tmux-256color"
setw -g mode-keys vi

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4

# Sessions by their place in the list: Alt-g first, Alt-f second, Alt-d third.
# Numbered names come first in number order (1, 2, 10), then the other names.
bind -n M-g run-shell 'tmux switch-client -t "=$(tmux list-sessions -F "##S" | sort -V | sed -n 1p)"'
bind -n M-f run-shell 'tmux switch-client -t "=$(tmux list-sessions -F "##S" | sort -V | sed -n 2p)"'
bind -n M-d run-shell 'tmux switch-client -t "=$(tmux list-sessions -F "##S" | sort -V | sed -n 3p)"'

# prefix n: new session named with the lowest free number, from 1
# (replaces the default "next window")
bind n run-shell 'n=1; while tmux list-sessions -F "##S" | grep -qE "^$n(-|\$)"; do n=$((n+1)); done; tmux new-session -d -s "$n" && tmux switch-client -t "=$n"'

# A session started without a name (plain `tmux`, `tmux new`) is named by tmux after its
# id, which counts from 0. Give it the lowest free number from 1 instead, like prefix n.
set-hook -g session-created { if -F '#{==:#{session_name},#{s/^.//:session_id}}' { run-shell 'n=1; while tmux list-sessions -f "##{!=:##{session_id},\#{session_id}}" -F "##S" | grep -qE "^$n(-|\$)"; do n=$((n+1)); done; [ "$n" = "#{session_name}" ] || tmux rename-session -t "\#{session_id}" "$n"' } }

# prefix $: rename the session. Only the name is typed: the number in front is kept,
# and a session without one gets the lowest free number ("so" becomes "2-so").
bind '$' command-prompt -p "session name:" -I '#{s/^[0-9]+-?//:session_name}' { set -g @rename_to "%%%" ; run-shell 'num="#{?#{m/r:^[0-9]+(-|$),#S},#{s/-.*//:session_name},}"; new=$(tmux show -gv @rename_to | sed -E "s/^[0-9]+-//"); [ -z "$new" ] && exit 0; if [ -z "$num" ]; then num=1; while tmux list-sessions -F "##S" | grep -qE "^$num(-|\$)"; do num=$((num+1)); done; fi; tmux rename-session -t "\#{session_id}" "$num-$new"' }

# prefix q: close the session, after a y/n (replaces the default "show pane numbers")
bind q confirm-before -p "kill-session #S? (y/n)" kill-session

# Pane navigation (vi-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New splits and windows open in the folder of the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix r: reload this file (replaces the default "redraw the client")
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# UI - Pane borders
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Status bar: no plugins. Colours are Catppuccin Mocha, icons are Nerd Font glyphs,
# and the numbers come from ~/.config/tmux/status.sh.
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"   # transparent background
set -g status-left-length 100
set -g status-right-length 100

# Left: session, then the windows
set -g status-left "#[fg=#a6e3a1,bg=default]▐#[fg=#11111b,bg=#a6e3a1] #[fg=#cdd6f4,bg=#313244] #S #[bg=default]  "
set -g window-status-separator " "
set -g window-status-format "#[fg=#cdd6f4,bg=default] #I #W "
set -g window-status-current-format "#[fg=#89dceb,bg=#313244] #I #W "

# Right: network speed, CPU, RAM, battery, date (day/month hour:minute)
set -g status-right ""
set -ag status-right "#[fg=#94e2d5,bg=default]▐#[fg=#11111b,bg=#94e2d5]󰯎 #[fg=#cdd6f4,bg=#313244] #(~/.config/tmux/status.sh net) #[bg=default]  "
set -ag status-right "#[fg=#f9e2af,bg=default]▐#[fg=#11111b,bg=#f9e2af] #[fg=#cdd6f4,bg=#313244] #(~/.config/tmux/status.sh cpu) #[bg=default]  "
set -ag status-right "#[fg=#fab387,bg=default]▐#[fg=#11111b,bg=#fab387] #[fg=#cdd6f4,bg=#313244] #(~/.config/tmux/status.sh ram) #[bg=default]  "
set -ag status-right "#[fg=#b4befe,bg=default]▐#[fg=#11111b,bg=#b4befe]#(~/.config/tmux/status.sh battery-icon) #[fg=#cdd6f4,bg=#313244] #(~/.config/tmux/status.sh battery) #[bg=default]  "
set -ag status-right "#[fg=#89b4fa,bg=default]▐#[fg=#11111b,bg=#89b4fa] #[fg=#cdd6f4,bg=#313244] %d/%m %H:%M #[bg=default]"
